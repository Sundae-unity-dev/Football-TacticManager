name: 배포

# 앱에 영향을 주는 것이 main 에 들어오면 올린다.
#
# 한 번 도는 데 5분쯤이다 (테스트 1분50초 · AOT 2분 · 나머지 1분).
# 같은 AOT 가 윈도 노트북에서는 20분이 걸리는데 러너에서는 2분이다 — 브라우저 수치와
# 마찬가지로, 빌드 시간도 재 보기 전에는 모른다.
#
# README·문서만 고친 푸시로는 돌리지 않는다. 바뀌지 않은 것을 다시 만들 이유가 없다.
# 손으로 돌리고 싶으면 Actions 탭에서 "배포"를 골라 Run workflow 를 누른다.
on:
  push:
    branches: [main]
    paths:
      - 'FT.App/**'
      - 'FT.Core/**'
      - 'FT.Core.Tests/**'
      - 'FootballTactician.slnx'
      - 'tools/prepare-pages.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치면 안 된다. 다만 **돌고 있는 것을 끊지는 않는다** —
# 끊으면 이미 쓴 시간이 통째로 버려지고, 반쯤 올라간 상태가 남을 수 있다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 빌드와 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet 캐시
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: wasm-tools 설치
        run: dotnet workload install wasm-tools

      - name: 테스트
        # 세이브 포맷과 세계 생성은 테스트가 지킨다. 깨진 것을 올리지 않는다.
        run: dotnet test -c Release --logger "console;verbosity=normal"

      - name: 세계 지문 확인
        # 같은 시드로 38라운드를 돌린 세계의 해시. 동작이 달라지면 값이 달라진다.
        # 고의로 바꿨다면 이 값을 같이 고쳐야 한다.
        #
        # 기대값이 리눅스 것이다. 윈도에서 같은 코드를 돌리면 153b4f04297c6f48 가 나온다 —
        # MathF.Pow 가 플랫폼마다 마지막 자리에서 갈리기 때문이고, 결함이 아니라 성질이다
        # (docs/밸런싱.md "같은 시드가 같은 세계를 주는 범위" 참고).
        # 그래서 이 문지기는 **리눅스끼리** 비교할 때만 뜻이 있다. 그것으로 충분하다 —
        # 여기서 잡으려는 것은 고치다가 동작이 달라지는 것이지 플랫폼 차이가 아니다.
        run: |
          OUT=$(dotnet run --project FT.Sim -c Release -- fingerprint 38)
          echo "$OUT" | grep -E '경기 결과|순위표|선수|구단|이적|전체'
          FP=$(echo "$OUT" | grep -oE '전체 +[0-9a-f]{16}' | grep -oE '[0-9a-f]{16}')

          # 2026-11-02 에 급여를 고쳐 세계가 달라졌다(그 전 값 4993804eda9d08fd).
          # 리눅스 값은 이 러너만 알 수 있어, 한 번 비워 두고 돌려서 받아 적었다.
          EXPECTED="3fbb85f71f13235c"

          if [ -z "$EXPECTED" ]; then
            echo "::error::세계 지문 기대값이 비어 있습니다. 이번 실행의 값은 $FP 입니다 — 이 값을 EXPECTED 에 적고 다시 올리세요."
            exit 1
          fi
          if [ "$FP" != "$EXPECTED" ]; then
            echo "::error::세계 지문이 달라졌습니다 ($FP, 기대 $EXPECTED). 위의 영역별 해시로 어디가 달라졌는지 보세요. 일부러 바꿨다면 이 워크플로의 기대값도 고치세요."
            exit 1
          fi

      - name: 배포본 만들기 (AOT)
        run: dotnet publish FT.App -c Release -o publish

      - name: Pages 용으로 손보기
        run: bash tools/prepare-pages.sh publish/wwwroot

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    name: Pages 로 올리기
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
