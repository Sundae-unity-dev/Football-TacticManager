name: 배포

# 앱에 영향을 주는 것이 main 에 들어오면 올린다.
#
# AOT 컴파일 때문에 한 번 도는 데 20분쯤 걸린다. 그래서 README·문서·메모만 고친
# 푸시로는 돌리지 않는다 — 바뀌지 않은 것을 20분 걸려 다시 만들 이유가 없다.
# 손으로 돌리고 싶으면 Actions 탭에서 "배포"를 골라 Run workflow 를 누른다.
on:
  push:
    branches: [main]
    paths:
      - 'FT.App/**'
      - 'FT.Core/**'
      - 'FT.Core.Tests/**'
      - 'FootballTactician.slnx'
      - 'tools/prepare-pages.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치면 안 된다. 다만 **돌고 있는 것을 끊지는 않는다** —
# 20분짜리를 9분에서 끊으면 그 시간이 통째로 버려진다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 빌드와 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet 캐시
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: wasm-tools 설치
        run: dotnet workload install wasm-tools

      - name: 테스트
        # 세이브 포맷과 세계 생성은 테스트가 지킨다. 깨진 것을 올리지 않는다.
        run: dotnet test -c Release --logger "console;verbosity=normal"

      - name: 세계 지문 확인
        # 같은 시드로 38라운드를 돌린 세계의 해시. 동작이 달라지면 값이 달라진다.
        # 고의로 바꿨다면 이 값을 같이 고쳐야 한다.
        run: |
          FP=$(dotnet run --project FT.Sim -c Release -- fingerprint 38 \
               | grep -oE '전체 +[0-9a-f]{16}' | grep -oE '[0-9a-f]{16}')
          echo "지문: $FP"
          if [ "$FP" != "5d6a434ee8e98c3b" ]; then
            echo "::error::세계 지문이 달라졌습니다 ($FP). 동작을 바꿨다면 워크플로의 기대값도 고치세요."
            exit 1
          fi

      - name: 배포본 만들기 (AOT — 오래 걸립니다)
        run: dotnet publish FT.App -c Release -o publish

      - name: Pages 용으로 손보기
        run: bash tools/prepare-pages.sh publish/wwwroot

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    name: Pages 로 올리기
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
